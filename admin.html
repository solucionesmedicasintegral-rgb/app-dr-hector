<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06365f">
<link rel="manifest" href="manifest-admin.json">
<link rel="icon" href="assets/logo-admin.png">
<title>Admin · Dr. Héctor</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--navy:#06365f;--navy2:#0a4b80;--gold:#d7a72c;--ice:#edf3f7;--line:#dbe5ec}
*{box-sizing:border-box}body{margin:0;background:var(--ice);font-family:Inter,system-ui,sans-serif;color:#17212b}
.brand{background:linear-gradient(145deg,var(--navy),var(--navy2))}
.card{background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px #06365f0d}
.btn{background:var(--navy);color:#fff}.btn:hover{background:#052b4c}.btn:disabled{opacity:.45;cursor:not-allowed}
.gold{color:var(--gold)}.input{width:100%;border:1px solid #d9e1e7;border-radius:14px;padding:12px 14px;background:#fff}
.tab.active,.sidebarbtn.active{background:#0b537f;color:#fff}.tab{white-space:nowrap}
.badge{font-size:11px;border-radius:999px;padding:5px 9px;background:#edf4f8;color:#24506f}
.badge.green{background:#e9f6ed;color:#24723a}.badge.goldbg{background:#fff5d9;color:#7d5c00}.badge.gray{background:#eef1f3;color:#66717b}
.loader-backdrop{position:fixed;inset:0;background:rgba(237,243,247,.9);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100}
.loader-card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px 30px;box-shadow:0 18px 50px #06365f25;text-align:center;min-width:230px}
.loader-logo{width:66px;height:66px;border-radius:20px;animation:spin 1.15s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.desktop-sidebar{display:none}.mobile-tabs{display:flex}}@media(min-width:901px){.mobile-tabs{display:none}}

.install-banner{position:fixed;left:12px;right:12px;bottom:86px;z-index:80;max-width:560px;margin:auto;background:white;border:1px solid #dfe6ea;border-radius:20px;box-shadow:0 18px 40px #0002;padding:14px;display:flex;align-items:flex-start;gap:12px}
.install-banner img{width:44px;height:44px;border-radius:14px;flex:0 0 auto}
.install-banner .install-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.install-btn{border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.install-dismiss{background:#f1f3f5;color:#59636c}
.install-primary{background:var(--navy);color:white}

</style>
</head>
<body>
<div id="root"></div>
<div id="installMount"></div>
<script src="config.js"></script>
<script src="services.js"></script>
<script>
const C = window.HECTOR_CONFIG || {};
const S = window.HECTOR_SERVICES || [];

if (typeof C.paymentsEnabled === 'undefined') C.paymentsEnabled = false;
if (typeof C.paymentProvider === 'undefined') C.paymentProvider = null;

let state = {
  authorized:false,
  view:'resumen',
  loading:false,
  loadingText:'',
  patient:null,
  quoteItems:[],
  quoteResult:null,
  promoDate:'',
  pin:'',
  products:[],
  productsLoaded:false,
  productSearch:'',
  patientResults:[],
  orders:[],
  ordersLoaded:false,
  orderItems:[],
  orderDelivery:'recoger',
  orderShippingCost:250,
  orderAddress:'',
  rebooking:null,
  rebookingSlots:[],
  rebookingSlot:-1,
  rebookingDate:'',
  rebookingMonth:''
};

const money = n => new Intl.NumberFormat('es-MX',{
  style:'currency',currency:'MXN',maximumFractionDigits:0
}).format(Number(n||0));

async function core(body){
  const r = await fetch(C.webhook,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

function setLoading(on,text='Procesando…'){state.loading=on;state.loadingText=text;render()}
function toast(text){
  const e=document.createElement('div');
  e.className='fixed top-4 left-1/2 -translate-x-1/2 z-[120] bg-slate-950 text-white px-4 py-3 rounded-xl text-sm shadow-xl';
  e.textContent=text;document.body.appendChild(e);setTimeout(()=>e.remove(),2600);
}
function loader(){
  if(!state.loading)return '';
  return `<div class="loader-backdrop"><div class="loader-card">
    <img class="loader-logo" src="assets/logo-admin.png" alt="">
    <div class="font-semibold mt-4">${state.loadingText}</div>
    <div class="text-xs text-slate-500 mt-1">Espera unos segundos</div>
  </div></div>`;
}

function login(){
  return `<div class="min-h-screen flex items-center justify-center p-5 brand">
    <section class="bg-white w-full max-w-sm rounded-[30px] p-7 shadow-2xl">
      <div class="text-center">
        <img src="assets/logo-admin.png" class="w-20 h-20 rounded-3xl mx-auto" alt="">
        <div class="text-xs text-slate-500 mt-4">CONTROL CENTER</div>
        <h1 class="text-2xl font-semibold mt-1">Dr. Héctor Carrillo</h1>
        <p class="text-sm text-slate-500 mt-2">Acceso administrativo</p>
      </div>
      <form onsubmit="loginAdmin(event)" class="mt-6">
        <label class="text-sm font-medium">PIN</label>
        <input id="adminPin" type="password" inputmode="numeric" class="input mt-2 text-center text-2xl tracking-[.35em]" placeholder="••••">
        <button class="btn w-full rounded-2xl py-4 mt-4 font-semibold">Entrar al panel</button>
      </form>
      <p class="text-xs text-center text-slate-400 mt-4">El PIN se valida en n8n y no se guarda en esta página.</p>
    </section>${loader()}
  </div>`;
}

async function loginAdmin(e){
  e.preventDefault();
  const pin=document.querySelector('#adminPin').value.trim();
  if(!pin)return toast('Ingresa el PIN');
  state.pin=pin;
  setLoading(true,'Validando acceso…');
  try{
    const r=await core({action:'validar_admin',pin});
    state.loading=false;
    if(r.autorizado){state.authorized=true;render()}
    else{state.pin='';render();toast('PIN incorrecto')}
  }catch(err){state.loading=false;render();toast('No fue posible validar el acceso')}
}

const views=[
  ['resumen','Resumen','▦'],['pacientes','Pacientes','◉'],['citas','Citas','□'],
  ['cotizaciones','Cotizaciones','▤'],['pedidos','Pedidos','◇'],
  ['productos','Productos','◈'],['config','Config','⚙']
];

function header(){
  return `<header class="brand text-white sticky top-0 z-40">
    <div class="max-w-[1450px] mx-auto px-4 py-3 flex items-center gap-4">
      <img src="assets/logo-admin.png" class="w-12 h-12 rounded-2xl">
      <div><div class="text-[11px] opacity-70">CONTROL CENTER</div><div class="font-semibold text-lg">Dr. Héctor Carrillo</div></div>
      <div class="ml-auto flex items-center gap-2">
        <span class="hidden sm:inline text-xs opacity-70">Nimbo conectado</span>
        <button onclick="logout()" class="border border-white/20 rounded-xl px-3 py-2 text-sm">Salir</button>
      </div>
    </div>
    <div class="mobile-tabs overflow-x-auto px-3 pb-3 gap-2">
      ${views.map(([id,lbl])=>`<button onclick="go('${id}')" class="tab ${state.view===id?'active':'bg-white/10'} rounded-xl px-3 py-2 text-sm">${lbl}</button>`).join('')}
    </div>
  </header>`;
}
function sidebar(){
  return `<aside class="desktop-sidebar w-56 shrink-0">
    <div class="card rounded-3xl p-2 sticky top-24">
      ${views.map(([id,lbl,ico])=>`<button onclick="go('${id}')" class="sidebarbtn ${state.view===id?'active':''} w-full rounded-2xl p-3 text-left flex gap-3 items-center"><span>${ico}</span><span class="font-medium">${lbl}</span></button>`).join('')}
    </div>
  </aside>`;
}
function shell(){return `<div class="min-h-screen">${header()}<div class="max-w-[1450px] mx-auto p-4 flex gap-4 items-start">${sidebar()}<main class="min-w-0 flex-1">${content()}</main></div>${loader()}</div>`}

function content(){
  switch(state.view){
    case 'pacientes': return pacientes();
    case 'citas': return citas();
    case 'cotizaciones': return cotizaciones();
    case 'pedidos': return pedidos();
    case 'productos': return productos();
    case 'config': return config();
    default: return resumen();
  }
}

function resumen(){
  return `<div class="space-y-4">
    <section><h2 class="text-2xl font-semibold">Resumen</h2><p class="text-sm text-slate-500 mt-1">Vista general del consultorio y la APP.</p></section>
    <div class="grid md:grid-cols-3 gap-3">
      <button onclick="go('pacientes')" class="card rounded-3xl p-5 text-left"><b>Buscar paciente</b><div class="text-sm text-slate-500 mt-1">Consulta directa en Nimbo.</div></button>
      <button onclick="go('cotizaciones')" class="card rounded-3xl p-5 text-left"><b>Nueva cotización</b><div class="text-sm text-slate-500 mt-1">Generar PDF desde Drive.</div></button>
      <button onclick="go('citas')" class="card rounded-3xl p-5 text-left"><b>Citas</b><div class="text-sm text-slate-500 mt-1">Gestión de agenda.</div></button>
    </div>
    <section class="card rounded-3xl p-5">
      <div class="flex flex-wrap justify-between items-center gap-3">
        <div><h3 class="font-semibold text-lg">Confirmaciones de mañana</h3><p class="text-sm text-slate-500 mt-1">Citas de Nimbo listas para confirmar por WhatsApp.</p></div>
        <button onclick="loadTomorrowAppointments()" class="border rounded-xl px-4 py-2 text-sm">Actualizar</button>
      </div>
      <div class="mt-4">${tomorrowCards()}</div>
    </section>
  </div>`;
}

function patientSearchBox(){
  return `<section class="card rounded-3xl p-5">
    <h3 class="font-semibold text-lg">Buscar paciente</h3>
    <div class="flex flex-col sm:flex-row gap-2 mt-3">
      <input id="patientPhone" class="input" placeholder="Nombre, apellido o WhatsApp">
      <button onclick="findPatient()" class="btn rounded-2xl px-5 min-h-[48px]">Buscar</button>
    </div>
    <div class="mt-4">${patientResultsCard()}${patientCard()}</div>
  </section>`;
}
function patientCard(){
  if(!state.patient)return `<p class="text-sm text-slate-500">Sin paciente seleccionado.</p>`;
  const p=state.patient;
  return `<div class="border rounded-2xl p-4 bg-slate-50">
    <div class="font-semibold text-lg">${p.nombre||[p.first_name,p.last_name].filter(Boolean).join(' ')}</div>
    <div class="text-sm text-slate-500 mt-1">${p.telefono||''}</div>
    <div class="text-sm text-slate-500">${p.email||''}</div>
    <div class="text-xs text-slate-400 mt-2">Nimbo ID ${p.id||'—'}</div>
    <div class="grid sm:grid-cols-2 gap-2 mt-4">
      <button onclick="go('cotizaciones')" class="border rounded-xl py-2 px-3 text-sm">Cotizar</button>
      <button onclick="go('citas')" class="border rounded-xl py-2 px-3 text-sm">Gestionar cita</button>
    </div>
  </div>`;
}
async function findPatient(){
  const el=document.querySelector('#patientPhone');
  const q=(el?.value||'').trim();

  if(q.length<2)return toast('Escribe al menos 2 caracteres');

  const digits=q.replace(/\D/g,'');

  const payload={
    action:'buscar_paciente',
    busqueda:q
  };

  // Si parece teléfono, conservar también telefono para compatibilidad
  if(digits.length>=10){
    payload.telefono=digits.slice(-10);
    payload.busqueda=digits.slice(-10);
  }

  setLoading(true,'Buscando paciente en Nimbo…');

  try{
    const r=await core(payload);

    state.loading=false;
    state.patient=null;
    state.patientResults=[];
    state.orderItems=[];
    state.orderAddress='';
    state.appointments=[];
    state.appointmentsLoaded=false;

    if(r.encontrado){
      if(r.multiple && Array.isArray(r.pacientes)){
        state.patientResults=r.pacientes;
      }else if(r.paciente){
        state.patient=r.paciente;
      }else if(Array.isArray(r.pacientes) && r.pacientes.length===1){
        state.patient=r.pacientes[0];
      }
    }

    render();

    if(!r.encontrado){
      toast('Paciente no encontrado');
    }else if(state.patientResults.length>1){
      toast(`${state.patientResults.length} coincidencias encontradas`);
    }
  }catch(e){
    state.loading=false;
    state.patient=null;
    state.patientResults=[];
    render();
    toast('Error al buscar paciente');
  }
}

function selectPatientResult(i){
  const p=state.patientResults[i];
  if(!p)return;

  state.patient=p;
  state.patientResults=[];
  state.orderItems=[];
  state.orderAddress='';
  state.appointments=[];
  state.appointmentsLoaded=false;
  state.rebooking=null;
  state.rebookingSlots=[];
  state.rebookingSlot=-1;
  state.rebookingDate='';
  state.rebookingMonth='';

  render();
  toast('Paciente seleccionado');
}

function maskPhone(v){
  const d=String(v||'').replace(/\D/g,'');
  if(!d)return 'Sin teléfono';
  if(d.length<6)return d;
  return `${d.slice(0,2)}••••${d.slice(-4)}`;
}

function patientResultsCard(){
  if(!state.patientResults?.length)return '';

  return `<div class="mb-4 border border-amber-200 bg-amber-50 rounded-2xl p-4">
    <div class="font-semibold text-amber-900">Selecciona al paciente correcto</div>
    <div class="text-sm text-amber-800 mt-1">Encontramos ${state.patientResults.length} coincidencias en Nimbo.</div>

    <div class="space-y-2 mt-3">
      ${state.patientResults.map((p,i)=>`
        <button onclick="selectPatientResult(${i})" class="w-full text-left border bg-white rounded-xl p-3 hover:bg-slate-50">
          <div class="font-medium">${p.nombre||'Paciente'}</div>
          <div class="text-xs text-slate-500 mt-1">
            ${maskPhone(p.telefono)}${p.email?` · ${p.email}`:''}
          </div>
          <div class="text-xs text-slate-400 mt-1">Nimbo ID ${p.id||'—'}</div>
        </button>
      `).join('')}
    </div>
  </div>`;
}

function pacientes(){return `<div class="space-y-4"><section><h2 class="text-2xl font-semibold">Pacientes</h2><p class="text-sm text-slate-500 mt-1">Búsqueda directa en Nimbo.</p></section>${patientSearchBox()}</div>`}
function formatDateTimeMX(iso){
  if(!iso)return {fecha:'—',hora:'—'};
  const d=new Date(iso);
  if(Number.isNaN(d.getTime()))return {fecha:iso,hora:''};
  return {
    fecha:new Intl.DateTimeFormat('es-MX',{weekday:'short',day:'numeric',month:'short',timeZone:'America/Mexico_City'}).format(d),
    hora:new Intl.DateTimeFormat('es-MX',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'America/Mexico_City'}).format(d)
  };
}
function whatsappConfirmUrl(c){
  const raw=String(c.telefono||state.patient?.telefono||'').replace(/\D/g,'');
  const tel=raw.length===10?'52'+raw:raw;
  return `https://wa.me/${tel}?text=${encodeURIComponent(buildConfirmMessage(c))}`;
}
async function loadAppointments(){
  if(!state.patient?.id)return toast('Primero selecciona un paciente');
  setLoading(true,'Consultando citas en Nimbo…');
  try{
    const r=await core({action:'listar_citas',paciente_id:String(state.patient.id)});
    state.loading=false;
    state.appointments=Array.isArray(r.citas)?r.citas:[];
    state.appointmentsLoaded=true;
    render();
    if(!state.appointments.length)toast('No hay citas futuras para este paciente');
  }catch(e){
    state.loading=false;
    state.appointments=[];
    state.appointmentsLoaded=true;
    render();
    toast('No pude consultar las citas');
  }
}

function buildConfirmMessage(c){
  const f=formatDateTimeMX(c.starts_at);
  const nombre=(c.paciente||'').trim();
  return `Hola${nombre?' '+nombre:''} 😊 Te contactamos del consultorio del Dr. Héctor Carrillo para confirmar tu cita de mañana ${f.fecha} a las ${f.hora}.${c.servicio?`\n\nServicio: ${c.servicio}`:''}\n\n¿Nos confirmas tu asistencia, por favor?`;
}
function isTomorrowMX(iso){
  if(!iso)return false;
  const d=new Date(iso);
  if(Number.isNaN(d.getTime()))return false;
  const key=x=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).format(x);
  const now=new Date();
  const tomorrow=new Date(now.getTime()+24*60*60*1000);
  return key(d)===key(tomorrow);
}
async function loadTomorrowAppointments(){
  setLoading(true,'Consultando citas de mañana…');
  try{
    const r=await core({action:'listar_citas_manana'});
    state.loading=false;
    const all=Array.isArray(r.citas)?r.citas:[];
    state.tomorrowAppointments=all;
    state.tomorrowLoaded=true;
    render();
    if(!state.tomorrowAppointments.length)toast('No hay citas para mañana');
  }catch(e){
    state.loading=false;
    state.tomorrowAppointments=[];
    state.tomorrowLoaded=true;
    render();
    toast('No pude consultar las citas de mañana');
  }
}

function appointmentId(c){
  return String(c.cita_id||c.id||'').trim();
}
function getPaymentState(c){
  return c.estado_pago || 'pendiente';
}
function paymentBadge(c){
  const s=getPaymentState(c);
  if(s==='pagado') return `<span class="badge green">Pagado</span>`;
  if(s==='sin_pago') return `<span class="badge gray">Sin pago</span>`;
  if(s==='pendiente_liga') return `<span class="badge goldbg">Pendiente liga</span>`;
  if(s==='pendiente_transferencia') return `<span class="badge goldbg">Transferencia pendiente</span>`;
  return `<span class="badge goldbg">Pago pendiente</span>`;
}
async function savePaymentState(c,metodo,monto,estadoPago){
  const citaId=appointmentId(c);
  if(!citaId)return toast('Esta cita no tiene ID de Nimbo; no se guardó el pago');
  setLoading(true,'Guardando estado de pago…');
  try{
    const r=await core({
      action:'solicitar_pago',
      pin:state.pin,
      cita_id:citaId,
      paciente_id:String(c.person_id||c.paciente_id||''),
      telefono:String(c.telefono||''),
      email:String(c.email||''),
      servicio_id:String(c.servicio_id||''),
      metodo_pago:metodo,
      estado_pago:estadoPago||'',
      monto:Number(monto??c.monto??0),
      fecha:String(c.starts_at||''),
      hora:String(c.hora||'')
    });
    state.loading=false;
    if(r.ok!==true || appointmentId(r)!==citaId){render();toast('No pude guardar el estado de pago');return;}
    const estado=String(r.estado_pago||'');
    if(!['pagado','sin_pago','pendiente_liga','pendiente_transferencia'].includes(estado)){
      render();toast('Core no confirmó el estado del pago');return;
    }
    for(const item of [...(state.tomorrowAppointments||[]),...(state.appointments||[])]){
      if(appointmentId(item)===citaId){
        item.estado_pago=estado;
        item.monto=Number(r.monto);
        item.metodo_pago=String(r.metodo_pago||metodo);
      }
    }
    render();toast('Estado de pago guardado');
  }catch(e){state.loading=false;render();toast('No pude guardar el estado de pago');}
}
function markAppointmentPaid(id){
  const c=state.appointments.find(item=>appointmentId(item)===String(id));
  if(!c)return toast('No pude identificar la cita');
  if(c.estado_pago==='pagado')return toast('Este pago ya fue registrado');
  return markPaid({
    ...c,
    person_id:c.person_id||state.patient?.id,
    telefono:c.telefono||state.patient?.telefono||'',
    email:c.email||state.patient?.email||''
  });
}
async function markPaid(c){
  const amountText=prompt('Monto recibido en pesos:','');
  if(amountText===null)return;
  const amount=Number(amountText.trim());
  if(!amountText.trim()||!Number.isFinite(amount)||amount<=0)
    return toast('Indica un monto mayor a cero');
  const methodText=prompt('Método recibido: transferencia, liga, efectivo o tarjeta','transferencia');
  if(methodText===null)return;
  const metodo=methodText.trim().toLowerCase();
  if(!['transferencia','liga','efectivo','tarjeta'].includes(metodo))
    return toast('Elige un método de pago válido');
  if(!confirm('¿Confirmas que recibiste '+money(amount)+' por '+metodo+'?'))return;
  await savePaymentState(c,metodo,amount,'pagado');
}
async function setPendingType(c,type){
  const metodo=type==='pendiente_transferencia'?'transferencia'
    :type==='pendiente_liga'?'liga':type;
  await savePaymentState(c,metodo);
}


function tomorrowCards(){
  if(!state.tomorrowLoaded)return `<button onclick="loadTomorrowAppointments()" class="btn rounded-2xl px-5 py-3 font-semibold">Cargar citas de mañana</button>`;
  if(!state.tomorrowAppointments.length)return `<div class="border border-dashed rounded-2xl p-5 text-sm text-slate-500">No hay citas programadas para mañana.</div>`;
  return `<div class="space-y-3">${state.tomorrowAppointments.map(c=>{
    const f=formatDateTimeMX(c.starts_at);
    return `<div class="border rounded-2xl p-4 bg-white">
      <div class="flex flex-wrap justify-between gap-3">
        <div>
          <div class="font-semibold">${c.paciente||'Paciente'}</div>
          <div class="text-sm text-slate-600 mt-1">${f.fecha} · ${f.hora}</div>
          <div class="text-sm text-slate-500 mt-1">${c.servicio||c.motivo||'Cita'}</div>
          ${c.telefono?`<div class="text-xs text-slate-400 mt-1">${c.telefono}</div>`:''}
        </div>
        <div class="flex gap-2 items-start flex-wrap">
          <span class="badge goldbg">Mañana</span>
          ${paymentBadge(c)}
        </div>
      </div>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2 mt-4">
        <a href="${whatsappConfirmUrl(c)}" target="_blank" rel="noopener" class="btn rounded-xl py-2.5 px-3 text-center text-sm font-semibold">Confirmar por WhatsApp</a>
        <button onclick='markPaid(${JSON.stringify(c)})' class="border border-emerald-300 rounded-xl py-2.5 px-3 text-sm font-semibold text-emerald-700">Marcar como pagado</button>
        <button onclick='copyConfirmMessage(${JSON.stringify(c)})' class="border rounded-xl py-2.5 px-3 text-sm">Copiar mensaje</button>
      </div>
      <div class="flex gap-2 flex-wrap mt-3">

function adminAppointmentId(c){return String(c?.id ?? c?.cita_id ?? '');}
function adminAppointmentDuration(c){
  const minutes=(new Date(c?.ends_at).getTime()-new Date(c?.starts_at).getTime())/60000;
  return Number.isFinite(minutes)&&minutes>0&&minutes<=240?Math.round(minutes):60;
}
function adminAppointmentMode(c){
  const text=String(c?.servicio||c?.motivo||'').toLowerCase();
  return /virtual|online/.test(text)?'virtual':'presencial';
}
function localAppointmentParts(iso){
  const d=new Date(iso);
  if(!Number.isFinite(d.getTime()))return null;
  const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{
    timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',
    day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'
  }).formatToParts(d).map(x=>[x.type,x.value]));
  return {fecha:`${parts.year}-${parts.month}-${parts.day}`,hora:`${parts.hour}:${parts.minute}`};
}
async function openAdminRebooking(id){
  const c=state.appointments.find(item=>adminAppointmentId(item)===String(id));
  if(!c)return toast('No pude identificar la cita');
  if((new Date(c.starts_at).getTime()-Date.now())<48*3600000)
    return toast('Core permite reagendar con al menos 48 horas de anticipación');
  state.rebooking=c;
  state.rebookingSlots=[];
  state.rebookingSlot=-1;
  state.rebookingDate='';
  state.rebookingMonth='';
  setLoading(true,'Buscando horarios disponibles…');
  try{
    const r=await core({
      action:'consultar_disponibilidad',
      modalidad:adminAppointmentMode(c),
      duracion:adminAppointmentDuration(c)
    });
    state.rebookingSlots=Array.isArray(r.horarios)?r.horarios:[];
    const firstDay=adminAvailableDates()[0]||'';
    state.rebookingDate=firstDay;
    state.rebookingMonth=firstDay.slice(0,7);
    state.loading=false;
    render();
    if(!state.rebookingSlots.length)toast('No hay horarios disponibles');
  }catch(e){
    state.loading=false;
    render();
    toast('No pude consultar disponibilidad');
  }
}
function adminAvailableDates(){
  return [...new Set(state.rebookingSlots.map(slot=>String(slot.fecha||''))
    .filter(fecha=>/^\d{4}-\d{2}-\d{2}$/.test(fecha)))].sort();
}
function adminSelectRebookingDay(fecha){
  if(!adminAvailableDates().includes(fecha))return;
  state.rebookingDate=fecha;
  state.rebookingSlot=-1;
  render();
}
function adminMoveRebookingMonth(direction){
  const months=[...new Set(adminAvailableDates().map(fecha=>fecha.slice(0,7)))];
  const at=months.indexOf(state.rebookingMonth);
  const next=months[at+direction];
  if(!next)return;
  state.rebookingMonth=next;
  state.rebookingDate='';
  state.rebookingSlot=-1;
  render();
}
function adminRebookingPanel(){
  const c=state.rebooking;
  if(!c)return '';
  const current=new Date(c.starts_at);
  if(!Number.isFinite(current.getTime()))return '';
  const dates=adminAvailableDates();
  if(!dates.length)return `<section class="border border-sky-200 rounded-2xl p-4 mt-4 bg-sky-50">
    <div class="font-semibold">Reprogramar cita</div>
    <p class="text-sm mt-2">No hay horarios disponibles por ahora.</p>

  </section>`;
  const months=[...new Set(dates.map(fecha=>fecha.slice(0,7)))];
  const month=months.includes(state.rebookingMonth)?state.rebookingMonth:months[0];
  const [year,number]=month.split('-').map(Number);
  const first=new Date(Date.UTC(year,number-1,1));
  const days=new Date(Date.UTC(year,number,0)).getUTCDate();
  const leading=(first.getUTCDay()+6)%7;
  const activeDates=new Set(dates);
  const selected=state.rebookingDate;
  const cells=Array.from({length:leading},()=>'<span></span>').concat(
    Array.from({length:days},(_,i)=>{
      const fecha=`${month}-${String(i+1).padStart(2,'0')}`;

      return `<button type="button" ${available?`onclick="adminSelectRebookingDay('${fecha}')"`:'disabled'}
        class="rounded-xl h-11 text-sm font-medium ${selected===fecha?'bg-[#06365f] text-white':available?'bg-white border border-sky-300 text-sky-900 hover:bg-sky-100':'text-slate-400 cursor-default'}"
        aria-label="${fecha}" ${selected===fecha?'aria-pressed="true"':''}>${i+1}</button>`;
    })
  ).join('');
  const slotIndexes=state.rebookingSlots.map((slot,i)=>slot.fecha===selected?i:-1).filter(i=>i>=0);
  const title=first.toLocaleDateString('es-MX',{month:'long',year:'numeric',timeZone:'UTC'});
  return `<section class="border border-sky-200 rounded-2xl p-4 mt-4 bg-sky-50">
    <div class="font-semibold">Reprogramar: ${formatDateTimeMX(c.starts_at).fecha} · ${formatDateTimeMX(c.starts_at).hora}</div>
    <p class="text-xs text-slate-600 mt-1">Solo se puede reagendar una vez y al menos 48 horas antes. Elige un día marcado y después un horario.</p>

          <button type="button" onclick="adminMoveRebookingMonth(-1)" ${month===months[0]?'disabled':''}
            class="border rounded-lg px-3 py-1 disabled:opacity-30" aria-label="Mes anterior">‹</button>
          <h4 class="font-semibold capitalize">${title}</h4>
          <button type="button" onclick="adminMoveRebookingMonth(1)" ${month===months[months.length-1]?'disabled':''}
            class="border rounded-lg px-3 py-1 disabled:opacity-30" aria-label="Mes siguiente">›</button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-500 mb-2">
          ${['L','M','M','J','V','S','D'].map((x,i)=>`<span aria-label="${['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'][i]}">${x}</span>`).join('')}
        </div>
        <div class="grid grid-cols-7 gap-1 text-center">${cells}</div>
        <p class="text-xs text-slate-500 mt-3">Los días marcados tienen horarios disponibles.</p>
      </div>
      <div>
        <h4 class="font-semibold mb-2">${selected?`Horarios del ${selected.split('-').reverse().join('/')}`:'Elige un día disponible'}</h4>
        <div class="grid grid-cols-2 gap-2">
          ${slotIndexes.map(i=>`<button type="button" onclick="state.rebookingSlot=${i};render()"
            class="border rounded-xl px-3 py-3 text-sm ${state.rebookingSlot===i?'bg-[#06365f] text-white':'bg-white hover:bg-sky-100'}"
            aria-pressed="${state.rebookingSlot===i}">${escapeCatalogText(state.rebookingSlots[i].hora)}</button>`).join('')}
        </div>
      </div>
    </div>
    <div class="flex flex-wrap gap-2 mt-4">
      <button onclick="confirmAdminRebooking()" ${state.rebookingSlot<0?'disabled':''} class="btn rounded-xl px-4 py-2">Confirmar cambio</button>
      <button onclick="state.rebooking=null;render()" class="border rounded-xl px-4 py-2">Cerrar</button>

async function confirmAdminRebooking(){
  const c=state.rebooking, slot=state.rebookingSlots[state.rebookingSlot];
  if(!c||!slot)return toast('Selecciona un horario disponible');
  if((new Date(c.starts_at).getTime()-Date.now())<48*3600000)
    return toast('La ventana de 48 horas ya cerró');
  if(!confirm(`¿Reagendar esta cita al ${slot.fecha} a las ${slot.hora}? Esta cita solo puede cambiarse una vez.`))return;
  const patientId=String(state.patient?.id||'');
  const originalId=adminAppointmentId(c);
  setLoading(true,'Reagendando en Nimbo…');
  try{
    const r=await core({
      action:'validar_reagendacion',cita_id:originalId,
      starts_at:String(c.starts_at||''),paciente_id:patientId,
      nueva_fecha:String(slot.fecha),nueva_hora:String(slot.hora),
      duracion:adminAppointmentDuration(c)
    });
    if(r?.ok===false||r?.permitido===false){
      state.loading=false;render();
      return toast(r?.mensaje||'No se pudo reagendar la cita');
    }
    const result=await core({action:'listar_citas',paciente_id:patientId});
    const citas=Array.isArray(result?.citas)?result.citas:[];
    const actual=citas.find(item=>adminAppointmentId(item)===originalId);
    const fecha=actual&&localAppointmentParts(actual.starts_at);
    const changed=fecha?.fecha===slot.fecha&&fecha?.hora===slot.hora;
    state.appointments=citas;
    state.appointmentsLoaded=true;
    state.rebooking=null;
    state.rebookingSlots=[];
    state.rebookingSlot=-1;
  state.rebookingDate='';
  state.rebookingMonth='';
    state.loading=false;
    render();
    toast(changed?'Cita reagendada en Nimbo':'No pude confirmar el cambio en Nimbo; revisa la cita antes de intentarlo de nuevo');
  }catch(e){
    state.loading=false;render();
    toast('No pude confirmar el cambio; revisa la cita antes de intentarlo de nuevo');
  }
}

async function generateQuote(){
  if(!state.patient||!state.quoteItems.length)return;
  if(!C.quoteWebhook)return toast('Falta configurar quoteWebhook');
  setLoading(true,'Generando cotización…');
  const payload={
    numero_cotizacion:'HC-'+Date.now(),
    fecha:new Date().toLocaleDateString('es-MX'),
    vigencia_dias:30,
    vigencia_fecha:formatPromoDate(state.promoDate),
    paciente:{
      id:state.patient.id,
      nombre:state.patient.nombre||[state.patient.first_name,state.patient.last_name].filter(Boolean).join(' '),
      telefono:state.patient.telefono,
      correo:state.patient.email
    },
    items:state.quoteItems.map(x=>({
      concepto:x.concepto,
      descripcion:x.descripcion,
      incluye:x.incluye||'',
      precio_lista:Number(x.precio_lista||x.precio||0),
      precio_promo:Number(x.precio_promo||0),
      precio:effectiveQuotePrice(x),
      nimbo_item_id:x.nimbo_item_id||null
    })),
    total:quoteTotal()
  };
  try{
    const resp=await fetch(C.quoteWebhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await resp.json().catch(()=>({}));
    state.loading=false;
    if(!resp.ok||data.ok===false){render();toast('El workflow respondió con error');return}
    state.quoteResult=data;render();toast('Cotización generada');
  }catch(e){state.loading=false;render();toast('No pude conectar con cotizaciones')}
}

    state.products=Array.isArray(r.productos)?r.productos:[];
    state.productsLoaded=true;
    render();
    if(!state.products.length)toast('No encontré conceptos activos');
  }catch(e){
    state.loading=false;
    state.products=[];
    state.productsLoaded=true;
    render();
    toast('No pude cargar el catálogo de Nimbo');
  }
}

function setAdminProductSearch(v){
  state.productSearch=String(v||'');
  render();
  const el=document.querySelector('#adminProductSearch');
  if(el){
    el.focus();
    try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}
  }
}

function filteredProducts(){
  const q=state.productSearch.trim().toLocaleLowerCase('es-MX');
  if(!q)return state.products;
  return state.products.filter(p=>String(p.nombre||'').toLocaleLowerCase('es-MX').includes(q)
    || catalogCategory(p).toLocaleLowerCase('es-MX').includes(q));
}

function addNimboItemToQuote(id){
  const p=state.products.find(x=>String(x.id)===String(id));
  if(!p)return toast('No encontré el concepto');

  state.quoteItems.push({
    concepto:p.nombre||'Concepto Nimbo',
    descripcion:'Concepto tomado del catálogo de Nimbo',
    incluye:'',
    precio_lista:Number(p.precio||0),
    precio_promo:0,
    precio:Number(p.precio||0),
    nimbo_item_id:p.id
  });

  state.quoteResult=null;
  state.view='cotizaciones';
  render();
  toast('Concepto agregado a la cotización');
}

function catalogCategory(p){
  const raw=p.categoria||p.category||p.product_category||p.productCategory||'';
  const name=typeof raw==='object' ? String(raw?.nombre||raw?.name||'') : String(raw);
  if(name.trim())return name.trim();
  if(p.stockable===true || p.type==='product')return 'Productos';
  return 'Servicios y estudios';
}
function escapeCatalogText(v){
  return String(v??'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}
function adminCatalogGroups(rows){
  const q=state.productSearch.trim();
  const groups=new Map();
  for(const p of rows){
    const name=catalogCategory(p);
    if(!groups.has(name))groups.set(name,[]);
    groups.get(name).push(p);
  }
  return [...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0],'es-MX')).map(([category,items])=>{
    const initials=new Map();
    for(const p of items.sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es-MX'))){
      const c=String(p.nombre||'').trim().charAt(0).toLocaleUpperCase('es-MX');
      const key=/^[A-ZÁÉÍÓÚÑ]$/.test(c)?c:'#';
      if(!initials.has(key))initials.set(key,[]);
      initials.get(key).push(p);
    }
    return `<details class="border rounded-2xl p-4 mt-3" ${q?'open':''}>
      <summary class="cursor-pointer font-semibold">${escapeCatalogText(category)} <span class="text-slate-400 text-sm">(${items.length})</span></summary>
      <div class="space-y-3 mt-4">${[...initials.entries()].map(([letter,products])=>`
        <details class="border rounded-xl p-3" ${q?'open':''}>
          <summary class="cursor-pointer font-medium">${letter} <span class="text-slate-400 text-xs">(${products.length})</span></summary>
          <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-3 mt-3">${products.map(p=>`
            <article class="border rounded-2xl p-4 bg-white">
              <div class="flex justify-between gap-3">
                <div class="min-w-0">
                  <div class="font-semibold">${escapeCatalogText(p.nombre||'Concepto')}</div>
                  <div class="text-xs text-slate-400 mt-1">Nimbo ID ${escapeCatalogText(p.id)}</div>
                  ${p.sku?`<div class="text-xs text-slate-400 mt-1">SKU ${escapeCatalogText(p.sku)}</div>`:''}
                  ${p.stockable?`<div class="text-xs text-slate-400 mt-1">Stock: ${Number(p.stock)<0?'Disponible':escapeCatalogText(p.stock)}</div>`:''}
                </div>
                <div class="gold font-semibold shrink-0">${money(p.precio)}</div>
              </div>
              <button onclick="addNimboItemToQuote('${escapeCatalogText(p.id)}')" class="w-full border rounded-xl py-2 mt-3 text-sm font-medium">Agregar a cotización</button>
            </article>`).join('')}</div>
        </details>`).join('')}</div>
    </details>`;
  }).join('') || '<div class="p-4 text-sm text-slate-500">No encontramos resultados.</div>';
}
function nimboCatalogForQuotes(){
  if(!state.productsLoaded){
    return `<div class="border border-dashed rounded-2xl p-5 text-sm text-slate-500">
      <div>Catálogo Nimbo aún no cargado.</div>
      <button onclick="loadProducts()" class="btn rounded-xl px-4 py-2 mt-3">Cargar catálogo</button>
    </div>`;
  }

  const rows=filteredProducts();

  return `<div class="space-y-3">
    <div class="flex flex-col sm:flex-row gap-2">
      <input id="adminProductSearch"
        value="${state.productSearch.replace(/"/g,'&quot;')}"
        oninput="setAdminProductSearch(this.value)"
        class="input"
        placeholder="Buscar FIV, biopsia, DIU, medicamento…">
      <button onclick="loadProducts()" class="border rounded-xl px-4 py-2 text-sm">Actualizar</button>
    </div>

    <div class="text-xs text-slate-400">${rows.length} resultados visibles</div>

const ORDER_SHIPPING=250;
const ORDER_STATES=['solicitado','recibido_consultorio','enviado','entregado'];
const ORDER_LABELS={
  solicitado:'Solicitado',recibido_consultorio:'Recibido en consultorio',
  enviado:'Enviado',entregado:'Entregado'
};
function orderSubtotal(){
  return state.orderItems.reduce((sum,item)=>sum+item.cantidad*item.precio_unitario,0);
}
function orderShipping(){
  return state.orderDelivery==='domicilio'?state.orderShippingCost:0;
}
function setOrderShippingCost(value){
  const amount=Number(String(value).trim());
  if(!Number.isInteger(amount) || amount<0 || amount>2000){
    render();toast('El envío debe ser de $0 a $2,000 en pesos enteros');return;
  }
  state.orderShippingCost=amount;
  render();
}
function addOrderItem(){
  const id=document.querySelector('#orderProduct')?.value;
  const p=state.products.find(item=>String(item.id)===String(id));
  const cantidad=Number(document.querySelector('#orderQty')?.value);
  if(!p)return toast('Elige un producto del catálogo');
  if(!Number.isInteger(cantidad) || cantidad<1 || cantidad>20)return toast('Indica de 1 a 20 unidades');
  const precio=Number(p.precio);
  if(!Number.isFinite(precio) || precio<=0)return toast('Este producto no tiene precio confirmado en Nimbo');
  const existing=state.orderItems.find(item=>String(item.producto_id)===String(p.id));
  if(existing && existing.cantidad+cantidad>20)return toast('Máximo 20 unidades por producto');
  if(existing)existing.cantidad+=cantidad;
  else state.orderItems.push({
    producto_id:String(p.id),nombre:String(p.nombre||'Producto'),
    cantidad,precio_unitario:precio
  });
  render();
}
function removeOrderItem(index){state.orderItems.splice(index,1);render()}
async function loadOrders(){
  setLoading(true,'Cargando pedidos…');
  try{
    const r=await core({action:'listar_pedidos',pin:state.pin});
    if(r.ok!==true || !Array.isArray(r.pedidos))throw new Error('Respuesta de pedidos inválida');
    state.orders=r.pedidos.map(o=>({
      ...o,items:Array.isArray(o.items)?o.items:(()=>{try{return JSON.parse(o.items||'[]')}catch(e){return []}})()
    }));
    state.ordersLoaded=true;
    state.loading=false;
    render();
  }catch(e){state.loading=false;render();toast('No pude consultar pedidos en Core')}
}
async function createOrder(){
  if(!state.patient?.id)return toast('Selecciona a la paciente');
  if(!state.orderItems.length)return toast('Agrega al menos un producto');
  if(state.orderDelivery==='domicilio' && !state.orderAddress.trim())
    return toast('Indica la dirección de entrega');
  if(state.orderDelivery==='domicilio' &&
     (!Number.isInteger(state.orderShippingCost) || state.orderShippingCost<0 || state.orderShippingCost>2000))
    return toast('El envío debe ser de $0 a $2,000');
  const total=orderSubtotal()+orderShipping();
  if(!confirm('¿Registrar este pedido por '+money(total)+'?'))return;
  const pedidoId='PED-'+Date.now()+'-'+crypto.randomUUID().slice(0,8);
  const payload={
    action:'crear_pedido',pin:state.pin,pedido_id:pedidoId,
    paciente_id:String(state.patient.id),
    paciente_nombre:String(state.patient.nombre||state.patient.first_name||''),
    telefono:String(state.patient.telefono||state.patient.telephone2||''),
    items:state.orderItems.map(x=>({...x})),
    subtotal:orderSubtotal(),tipo_entrega:state.orderDelivery,
    costo_envio:orderShipping(),total,
    direccion_entrega:state.orderDelivery==='domicilio'?state.orderAddress.trim():'',
    estado_pedido:'solicitado',estado_pago:'pendiente'
  };
  setLoading(true,'Registrando pedido…');
  try{
    const r=await core(payload);
    if(r.ok!==true || String(r.pedido_id)!==pedidoId)
      throw new Error('Core no confirmó el pedido');
    state.orderItems=[];
    state.orderAddress='';
    state.orderShippingCost=ORDER_SHIPPING;
    state.loading=false;
    await loadOrders();
    toast('Pedido registrado');
  }catch(e){state.loading=false;render();toast('No se guardó el pedido')}
}
function uberTrackingUrl(raw){
  try{
    const u=new URL(String(raw||'').trim());
    const host=u.hostname.toLowerCase();
    if(u.protocol==='https:' && (['uber.com','ubereats.com'].some(domain=>host===domain||host.endsWith('.'+domain))))
      return u.href;
  }catch(e){}
  return '';
}
async function updateOrder(index,changes){
  const o=state.orders[index];
  if(!o)return;
  setLoading(true,'Actualizando pedido…');
  try{
    const r=await core({
      action:'actualizar_pedido',pin:state.pin,pedido_id:String(o.pedido_id),
      ...changes
    });
    if(r.ok!==true || String(r.pedido_id)!==String(o.pedido_id))
      throw new Error('Core no confirmó el cambio');
    state.loading=false;
    await loadOrders();
    toast('Pedido actualizado');
  }catch(e){state.loading=false;render();toast('No se guardó el cambio')}
}
function nextOrderState(o){
  if(o?.tipo_entrega==='recoger' && o?.estado_pedido==='recibido_consultorio')return 'entregado';
  return ORDER_STATES[ORDER_STATES.indexOf(o?.estado_pedido)+1];
}
async function advanceOrder(index){
  const o=state.orders[index];
  const next=nextOrderState(o);
  if(!next)return;
  if(next==='enviado' && !uberTrackingUrl(o.rastreo_url)){
    toast('Guarda primero el enlace de rastreo de Uber');
    return;
  }
  if(!confirm('¿Confirmas: '+ORDER_LABELS[next]+'?'))return;
  await updateOrder(index,{estado_pedido:next});
}
async function saveOrderTracking(index){
  const input=document.querySelector('#tracking-'+index);
  const url=uberTrackingUrl(input?.value);
  if(!url)return toast('Pega un enlace HTTPS de Uber válido');
  await updateOrder(index,{rastreo_url:url});
}
async function confirmOrderPayment(index){
  const o=state.orders[index];
  if(!o || o.estado_pago==='pagado')return;
  const method=prompt('Método de pago recibido (transferencia, liga, efectivo o tarjeta):','transferencia');
  if(method===null)return;
  const metodo=method.trim().toLowerCase();
  if(!['transferencia','liga','efectivo','tarjeta'].includes(metodo))
    return toast('Método de pago no válido');
  if(!confirm('¿Confirmas que recibiste '+money(o.total)+' por '+metodo+'?'))return;
  await updateOrder(index,{estado_pago:'pagado',metodo_pago:metodo,monto_pagado:Number(o.total)});
}
async function editOrderShipping(index){
  const o=state.orders[index];
  if(!o || o.tipo_entrega!=='domicilio' || o.estado_pago==='pagado' ||
     ['enviado','entregado'].includes(o.estado_pedido))return;
  const value=prompt('Nuevo costo de envío (MXN):',String(o.costo_envio??250));
  if(value===null)return;
  const cost=Number(value.trim());
  if(!Number.isInteger(cost) || cost<0 || cost>2000)return toast('Indica un envío entre $0 y $2,000');
  if(!confirm('¿Confirmas el nuevo total de '+money(Number(o.subtotal)+cost)+'?'))return;
  await updateOrder(index,{costo_envio:cost});
}
function trackingWhatsApp(o){
  const url=uberTrackingUrl(o.rastreo_url);
  const digits=String(o.telefono||'').replace(/\D/g,'');
  if(!url || !digits)return '';
  const phone=digits.length===10?'52'+digits:digits;
  const msg='Tu pedido del consultorio del Dr. Héctor está en camino. Puedes seguir la entrega aquí: '+url;
  return 'https://wa.me/'+phone+'?text='+encodeURIComponent(msg);
}

let deferredInstallPrompt=null;
let installBannerDismissed=false;
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;}
function renderInstallBanner(){
  const mount=document.getElementById('installMount');
  if(!mount||isStandalone()||installBannerDismissed){if(mount)mount.innerHTML='';return;}
  const canNative=!!deferredInstallPrompt;
  const ios=isIOS();
  if(!canNative&&!ios){mount.innerHTML='';return;}
  mount.innerHTML=`<div class="install-banner">
    <img src="assets/logo-admin.png" alt="">
    <div class="min-w-0 flex-1">
      <div class="font-semibold text-sm">Instalar Admin</div>
      <div class="text-xs text-slate-500 mt-1">${ios?'Toca Compartir y luego “Agregar a pantalla de inicio”.':'Instálala en tu celular para abrirla como una app.'}</div>
      <div class="install-actions">
        ${canNative?'<button class="install-btn install-primary" onclick="installApp()">Instalar</button>':''}
        <button class="install-btn install-dismiss" onclick="dismissInstall()">Después</button>
      </div>
    </div>
  </div>`;
}
async function installApp(){
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  try{await deferredInstallPrompt.userChoice;}catch(e){}
  deferredInstallPrompt=null;
  renderInstallBanner();
}
function dismissInstall(){installBannerDismissed=true;renderInstallBanner();}
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredInstallPrompt=e;renderInstallBanner();});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;installBannerDismissed=true;renderInstallBanner();});
setTimeout(renderInstallBanner,900);

render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw-admin.js?v=31');
</script>
