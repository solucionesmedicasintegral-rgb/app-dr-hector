<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06365f">
<link rel="manifest" href="manifest-admin.json?v=30">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-admin-192.png?v=30">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon-admin.png?v=30">
<title>Admin · Dr. Héctor</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--navy:#06365f;--navy2:#0a4b80;--gold:#d7a72c;--ice:#edf3f7;--line:#dbe5ec}
*{box-sizing:border-box}body{margin:0;background:var(--ice);font-family:Inter,system-ui,sans-serif;color:#17212b}
.brand{background:linear-gradient(145deg,var(--navy),var(--navy2))}
.card{background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px #06365f0d}
.btn{background:var(--navy);color:#fff}.btn:hover{background:#052b4c}.btn:disabled{opacity:.45;cursor:not-allowed}
.gold{color:var(--gold)}.input{width:100%;border:1px solid #d9e1e7;border-radius:14px;padding:12px 14px;background:#fff}
.tab.active,.sidebarbtn.active{background:#0b537f;color:#fff}.tab{white-space:nowrap}
.badge{font-size:11px;border-radius:999px;padding:5px 9px;background:#edf4f8;color:#24506f}
.badge.green{background:#e9f6ed;color:#24723a}.badge.goldbg{background:#fff5d9;color:#7d5c00}.badge.gray{background:#eef1f3;color:#66717b}
.loader-backdrop{position:fixed;inset:0;background:rgba(237,243,247,.9);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100}
.loader-card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px 30px;box-shadow:0 18px 50px #06365f25;text-align:center;min-width:230px}
.loader-logo{width:66px;height:66px;border-radius:20px;animation:spin 1.15s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.desktop-sidebar{display:none}.mobile-tabs{display:flex}}@media(min-width:901px){.mobile-tabs{display:none}}

.install-banner{position:fixed;left:12px;right:12px;bottom:86px;z-index:80;max-width:560px;margin:auto;background:white;border:1px solid #dfe6ea;border-radius:20px;box-shadow:0 18px 40px #0002;padding:14px;display:flex;align-items:flex-start;gap:12px}
.install-banner img{width:44px;height:44px;border-radius:14px;flex:0 0 auto}
.install-banner .install-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.install-btn{border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.install-dismiss{background:#f1f3f5;color:#59636c}
.install-primary{background:var(--navy);color:white}

</style>
</head>
<body>
<div id="root"></div>
<div id="installMount"></div>
<script src="config.js"></script>
<script src="services.js"></script>
<script>
const C = window.HECTOR_CONFIG || {};
const S = window.HECTOR_SERVICES || [];

if (typeof C.paymentsEnabled === 'undefined') C.paymentsEnabled = false;
if (typeof C.paymentProvider === 'undefined') C.paymentProvider = null;

let state = {
  authorized:false,
  view:'resumen',
  loading:false,
  loadingText:'',
  patient:null,
  quoteItems:[],
  quoteResult:null,
  promoDate:'',
  pin:'',
  products:[],
  productsLoaded:false,
  productSearch:''
};

const money = n => new Intl.NumberFormat('es-MX',{
  style:'currency',currency:'MXN',maximumFractionDigits:0
}).format(Number(n||0));

async function core(body){
  const r = await fetch(C.webhook,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

function setLoading(on,text='Procesando…'){state.loading=on;state.loadingText=text;render()}
function toast(text){
  const e=document.createElement('div');
  e.className='fixed top-4 left-1/2 -translate-x-1/2 z-[120] bg-slate-950 text-white px-4 py-3 rounded-xl text-sm shadow-xl';
  e.textContent=text;document.body.appendChild(e);setTimeout(()=>e.remove(),2600);
}
function loader(){
  if(!state.loading)return '';
  return `<div class="loader-backdrop"><div class="loader-card">
    <img class="loader-logo" src="assets/logo-admin.png" alt="">
    <div class="font-semibold mt-4">${state.loadingText}</div>
    <div class="text-xs text-slate-500 mt-1">Espera unos segundos</div>
  </div></div>`;
}

function login(){
  return `<div class="min-h-screen flex items-center justify-center p-5 brand">
    <section class="bg-white w-full max-w-sm rounded-[30px] p-7 shadow-2xl">
      <div class="text-center">
        <img src="assets/logo-admin.png" class="w-20 h-20 rounded-3xl mx-auto" alt="">
        <div class="text-xs text-slate-500 mt-4">CONTROL CENTER</div>
        <h1 class="text-2xl font-semibold mt-1">Dr. Héctor Carrillo</h1>
        <p class="text-sm text-slate-500 mt-2">Acceso administrativo</p>
      </div>
      <form onsubmit="loginAdmin(event)" class="mt-6">
        <label class="text-sm font-medium">PIN</label>
        <input id="adminPin" type="password" inputmode="numeric" class="input mt-2 text-center text-2xl tracking-[.35em]" placeholder="••••">
        <button class="btn w-full rounded-2xl py-4 mt-4 font-semibold">Entrar al panel</button>
      </form>
      <p class="text-xs text-center text-slate-400 mt-4">El PIN se valida en n8n y no se guarda en esta página.</p>
    </section>${loader()}
  </div>`;
}

async function loginAdmin(e){
  e.preventDefault();
  const pin=document.querySelector('#adminPin').value.trim();
  if(!pin)return toast('Ingresa el PIN');
  state.pin=pin;
  setLoading(true,'Validando acceso…');
  try{
    const r=await core({action:'validar_admin',pin});
    state.loading=false;
    if(r.autorizado){state.authorized=true;render()}
    else{state.pin='';render();toast('PIN incorrecto')}
  }catch(err){state.loading=false;render();toast('No fue posible validar el acceso')}
}

const views=[
  ['resumen','Resumen','▦'],['pacientes','Pacientes','◉'],['citas','Citas','□'],
  ['cotizaciones','Cotizaciones','▤'],['pedidos','Pedidos','◇'],
  ['productos','Productos','◈'],['config','Config','⚙']
];

function header(){
  return `<header class="brand text-white sticky top-0 z-40">
    <div class="max-w-[1450px] mx-auto px-4 py-3 flex items-center gap-4">
      <img src="assets/logo-admin.png" class="w-12 h-12 rounded-2xl">
      <div><div class="text-[11px] opacity-70">CONTROL CENTER</div><div class="font-semibold text-lg">Dr. Héctor Carrillo</div></div>
      <div class="ml-auto flex items-center gap-2">
        <span class="hidden sm:inline text-xs opacity-70">Nimbo conectado</span>
        <button onclick="logout()" class="border border-white/20 rounded-xl px-3 py-2 text-sm">Salir</button>
      </div>
    </div>
    <div class="mobile-tabs overflow-x-auto px-3 pb-3 gap-2">
      ${views.map(([id,lbl])=>`<button onclick="go('${id}')" class="tab ${state.view===id?'active':'bg-white/10'} rounded-xl px-3 py-2 text-sm">${lbl}</button>`).join('')}
    </div>
  </header>`;
}
function sidebar(){
  return `<aside class="desktop-sidebar w-56 shrink-0">
    <div class="card rounded-3xl p-2 sticky top-24">
      ${views.map(([id,lbl,ico])=>`<button onclick="go('${id}')" class="sidebarbtn ${state.view===id?'active':''} w-full rounded-2xl p-3 text-left flex gap-3 items-center"><span>${ico}</span><span class="font-medium">${lbl}</span></button>`).join('')}
    </div>
  </aside>`;
}
function shell(){return `<div class="min-h-screen">${header()}<div class="max-w-[1450px] mx-auto p-4 flex gap-4 items-start">${sidebar()}<main class="min-w-0 flex-1">${content()}</main></div>${loader()}</div>`}

function content(){
  switch(state.view){
    case 'pacientes': return pacientes();
    case 'citas': return citas();
    case 'cotizaciones': return cotizaciones();
    case 'pedidos': return pedidos();
    case 'productos': return productos();
    case 'config': return config();
    default: return resumen();
  }
}

function resumen(){
  return `<div class="space-y-4">
    <section><h2 class="text-2xl font-semibold">Resumen</h2><p class="text-sm text-slate-500 mt-1">Vista general del consultorio y la APP.</p></section>
    <div class="grid md:grid-cols-3 gap-3">
      <button onclick="go('pacientes')" class="card rounded-3xl p-5 text-left"><b>Buscar paciente</b><div class="text-sm text-slate-500 mt-1">Consulta directa en Nimbo.</div></button>
      <button onclick="go('cotizaciones')" class="card rounded-3xl p-5 text-left"><b>Nueva cotización</b><div class="text-sm text-slate-500 mt-1">Generar PDF desde Drive.</div></button>
      <button onclick="go('citas')" class="card rounded-3xl p-5 text-left"><b>Citas</b><div class="text-sm text-slate-500 mt-1">Gestión de agenda.</div></button>
    </div>
    <section class="card rounded-3xl p-5">
      <div class="flex flex-wrap justify-between items-center gap-3">
        <div><h3 class="font-semibold text-lg">Confirmaciones de mañana</h3><p class="text-sm text-slate-500 mt-1">Citas de Nimbo listas para confirmar por WhatsApp.</p></div>
        <button onclick="loadTomorrowAppointments()" class="border rounded-xl px-4 py-2 text-sm">Actualizar</button>
      </div>
      <div class="mt-4">${tomorrowCards()}</div>
    </section>
  </div>`;
}

function patientSearchBox(){
  return `<section class="card rounded-3xl p-5">
    <h3 class="font-semibold text-lg">Buscar paciente</h3>
    <div class="flex flex-col sm:flex-row gap-2 mt-3">
      <input id="patientPhone" inputmode="numeric" maxlength="10" class="input" placeholder="WhatsApp, 10 dígitos">
      <button onclick="findPatient()" class="btn rounded-2xl px-5 min-h-[48px]">Buscar</button>
    </div>
    <div class="mt-4">${patientCard()}</div>
  </section>`;
}
function patientCard(){
  if(!state.patient)return `<p class="text-sm text-slate-500">Sin paciente seleccionado.</p>`;
  const p=state.patient;
  return `<div class="border rounded-2xl p-4 bg-slate-50">
    <div class="font-semibold text-lg">${p.nombre||[p.first_name,p.last_name].filter(Boolean).join(' ')}</div>
    <div class="text-sm text-slate-500 mt-1">${p.telefono||''}</div>
    <div class="text-sm text-slate-500">${p.email||''}</div>
    <div class="text-xs text-slate-400 mt-2">Nimbo ID ${p.id||'—'}</div>
    <div class="grid sm:grid-cols-2 gap-2 mt-4">
      <button onclick="go('cotizaciones')" class="border rounded-xl py-2 px-3 text-sm">Cotizar</button>
      <button onclick="go('citas')" class="border rounded-xl py-2 px-3 text-sm">Gestionar cita</button>
    </div>
  </div>`;
}
async function findPatient(){
  const el=document.querySelector('#patientPhone');
  const t=(el?.value||'').replace(/\D/g,'').slice(-10);
  if(t.length!==10)return toast('Ingresa 10 dígitos');
  setLoading(true,'Buscando paciente en Nimbo…');
  try{
    const r=await core({action:'buscar_paciente',telefono:t});
    state.loading=false;
    state.patient=r.encontrado?r.paciente:null;
    state.appointments=[];
    state.appointmentsLoaded=false;
    render();
    if(!state.patient)toast('Paciente no encontrado');
  }catch(e){state.loading=false;render();toast('Error al buscar paciente')}
}
function pacientes(){return `<div class="space-y-4"><section><h2 class="text-2xl font-semibold">Pacientes</h2><p class="text-sm text-slate-500 mt-1">Búsqueda directa en Nimbo.</p></section>${patientSearchBox()}</div>`}
function formatDateTimeMX(iso){
  if(!iso)return {fecha:'—',hora:'—'};
  const d=new Date(iso);
  if(Number.isNaN(d.getTime()))return {fecha:iso,hora:''};
  return {
    fecha:new Intl.DateTimeFormat('es-MX',{weekday:'short',day:'numeric',month:'short',timeZone:'America/Mexico_City'}).format(d),
    hora:new Intl.DateTimeFormat('es-MX',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'America/Mexico_City'}).format(d)
  };
}
function whatsappConfirmUrl(c){
  const raw=String(c.telefono||state.patient?.telefono||'').replace(/\D/g,'');
  const tel=raw.length===10?'52'+raw:raw;
  return `https://wa.me/${tel}?text=${encodeURIComponent(buildConfirmMessage(c))}`;
}
async function loadAppointments(){
  if(!state.patient?.id)return toast('Primero selecciona un paciente');
  setLoading(true,'Consultando citas en Nimbo…');
  try{
    const r=await core({action:'listar_citas',paciente_id:String(state.patient.id)});
    state.loading=false;
    state.appointments=Array.isArray(r.citas)?r.citas:[];
    state.appointmentsLoaded=true;
    render();
    if(!state.appointments.length)toast('No hay citas futuras para este paciente');
  }catch(e){
    state.loading=false;
    state.appointments=[];
    state.appointmentsLoaded=true;
    render();
    toast('No pude consultar las citas');
  }
}

function buildConfirmMessage(c){
  const f=formatDateTimeMX(c.starts_at);
  const nombre=(c.paciente||'').trim();
  return `Hola${nombre?' '+nombre:''} 😊 Te contactamos del consultorio del Dr. Héctor Carrillo para confirmar tu cita de mañana ${f.fecha} a las ${f.hora}.${c.servicio?`\n\nServicio: ${c.servicio}`:''}\n\n¿Nos confirmas tu asistencia, por favor?`;
}
function isTomorrowMX(iso){
  if(!iso)return false;
  const d=new Date(iso);
  if(Number.isNaN(d.getTime()))return false;
  const key=x=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).format(x);
  const now=new Date();
  const tomorrow=new Date(now.getTime()+24*60*60*1000);
  return key(d)===key(tomorrow);
}
async function loadTomorrowAppointments(){
  setLoading(true,'Consultando citas de mañana…');
  try{
    const r=await core({action:'listar_citas_manana'});
    state.loading=false;
    const all=Array.isArray(r.citas)?r.citas:[];
    state.tomorrowAppointments=all;
    state.tomorrowLoaded=true;
    render();
    if(!state.tomorrowAppointments.length)toast('No hay citas para mañana');
  }catch(e){
    state.loading=false;
    state.tomorrowAppointments=[];
    state.tomorrowLoaded=true;
    render();
    toast('No pude consultar las citas de mañana');
  }
}

function paymentStoreKey(c){
  return `hector_pago_${c.id||c.cita_id||c.person_id||''}_${c.starts_at||''}`;
}
function getPaymentState(c){
  try{return localStorage.getItem(paymentStoreKey(c)) || 'pendiente';}
  catch(e){return 'pendiente';}
}
function paymentBadge(c){
  const s=getPaymentState(c);
  if(s==='pagado') return `<span class="badge green">Pagado</span>`;
  if(s==='sin_pago') return `<span class="badge gray">Sin pago</span>`;
  if(s==='pendiente_liga') return `<span class="badge goldbg">Pendiente liga</span>`;
  if(s==='pendiente_transferencia') return `<span class="badge goldbg">Transferencia pendiente</span>`;
  return `<span class="badge goldbg">Pago pendiente</span>`;
}
async function markPaid(c){
  if(!confirm('¿Confirmas que ya validaste el pago de esta cita?'))return;
  setLoading(true,'Marcando pago…');
  try{
    const r=await core({
      action:'solicitar_pago',
      paciente_id:String(c.person_id||''),
      telefono:String(c.telefono||''),
      metodo_pago:'pagado',
      monto:Number(c.monto||0),
      fecha:String(c.starts_at||'')
    });
    state.loading=false;
    if(r.ok===false){render();toast('No pude registrar el estado');return;}
    try{localStorage.setItem(paymentStoreKey(c),'pagado')}catch(e){}
    render();toast('Pago marcado como validado');
  }catch(e){state.loading=false;render();toast('No pude registrar el pago');}
}
function setPendingType(c,type){
  try{localStorage.setItem(paymentStoreKey(c),type)}catch(e){}
  render();
}


function tomorrowCards(){
  if(!state.tomorrowLoaded)return `<button onclick="loadTomorrowAppointments()" class="btn rounded-2xl px-5 py-3 font-semibold">Cargar citas de mañana</button>`;
  if(!state.tomorrowAppointments.length)return `<div class="border border-dashed rounded-2xl p-5 text-sm text-slate-500">No hay citas programadas para mañana.</div>`;
  return `<div class="space-y-3">${state.tomorrowAppointments.map(c=>{
    const f=formatDateTimeMX(c.starts_at);
    return `<div class="border rounded-2xl p-4 bg-white">
      <div class="flex flex-wrap justify-between gap-3">
        <div>
          <div class="font-semibold">${c.paciente||'Paciente'}</div>
          <div class="text-sm text-slate-600 mt-1">${f.fecha} · ${f.hora}</div>
          <div class="text-sm text-slate-500 mt-1">${c.servicio||c.motivo||'Cita'}</div>
          ${c.telefono?`<div class="text-xs text-slate-400 mt-1">${c.telefono}</div>`:''}
        </div>
        <div class="flex gap-2 items-start flex-wrap">
          <span class="badge goldbg">Mañana</span>
          ${paymentBadge(c)}
        </div>
      </div>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2 mt-4">
        <a href="${whatsappConfirmUrl(c)}" target="_blank" rel="noopener" class="btn rounded-xl py-2.5 px-3 text-center text-sm font-semibold">Confirmar por WhatsApp</a>
        <button onclick='markPaid(${JSON.stringify(c)})' class="border border-emerald-300 rounded-xl py-2.5 px-3 text-sm font-semibold text-emerald-700">Marcar como pagado</button>
        <button onclick='copyConfirmMessage(${JSON.stringify(c)})' class="border rounded-xl py-2.5 px-3 text-sm">Copiar mensaje</button>
      </div>
      <div class="flex gap-2 flex-wrap mt-3">
        <button onclick='setPendingType(${JSON.stringify(c)},"pendiente_transferencia")' class="text-xs border rounded-lg px-2.5 py-1.5">Transferencia pendiente</button>
        <button onclick='setPendingType(${JSON.stringify(c)},"pendiente_liga")' class="text-xs border rounded-lg px-2.5 py-1.5">Pendiente liga</button>
        <button onclick='setPendingType(${JSON.stringify(c)},"sin_pago")' class="text-xs border rounded-lg px-2.5 py-1.5">Sin pago</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

async function copyConfirmMessage(c){
  try{await navigator.clipboard.writeText(buildConfirmMessage(c));toast('Mensaje copiado')}
  catch(e){toast('No pude copiar el mensaje')}
}
function appointmentCards(){
  if(!state.patient)return `<div class="border border-dashed rounded-2xl p-5 text-sm text-slate-500">Busca un paciente para consultar sus citas.</div>`;
  if(!state.appointmentsLoaded)return `<button onclick="loadAppointments()" class="btn rounded-2xl px-5 py-3 font-semibold">Consultar próximas citas</button>`;
  if(!state.appointments.length)return `<div class="border border-dashed rounded-2xl p-5 text-sm text-slate-500">Este paciente no tiene próximas citas registradas.</div>`;
  return `<div class="space-y-3">${state.appointments.map(c=>{
    const f=formatDateTimeMX(c.starts_at);
    return `<div class="border rounded-2xl p-4 bg-white">
      <div class="flex flex-wrap justify-between gap-3">
        <div>
          <div class="font-semibold">${c.servicio||c.motivo||'Cita'}</div>
          <div class="text-sm text-slate-600 mt-1">${f.fecha} · ${f.hora}</div>
          ${c.status?`<div class="text-xs text-slate-400 mt-1">Estado: ${c.status}</div>`:''}
        </div>
        <span class="badge green h-fit">Nimbo</span>
      </div>
      <div class="grid sm:grid-cols-2 gap-2 mt-4">
        <a href="${whatsappConfirmUrl(c)}" target="_blank" rel="noopener" class="border rounded-xl py-2 px-3 text-center text-sm font-medium">Confirmar por WhatsApp</a>
        <button disabled class="border rounded-xl py-2 px-3 text-sm text-slate-400">Reprogramar / cancelar — siguiente paso</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}
function citas(){
  return `<div class="space-y-4">
    <section><h2 class="text-2xl font-semibold">Citas</h2><p class="text-sm text-slate-500 mt-1">Gestión conectada con Nimbo.</p></section>
    ${patientSearchBox()}
    <section class="card rounded-3xl p-5">
      <div class="flex flex-wrap justify-between items-center gap-3">
        <div><h3 class="font-semibold text-lg">Próximas citas</h3><p class="text-sm text-slate-500">Consulta las citas futuras del paciente seleccionado.</p></div>
        ${state.patient?`<button onclick="loadAppointments()" class="border rounded-xl px-4 py-2 text-sm">Actualizar</button>`:''}
      </div>
      <div class="mt-4">${appointmentCards()}</div>
    </section>
  </div>`;
}

function addQuoteItem(code){
  const s=code?S.find(x=>x.code===code):S[0];
  if(!s)return;
  state.quoteItems.push({
    concepto:s.name,
    descripcion:s.description||'',
    incluye:'',
    precio_lista:Number(s.regular??s.promo??0),
    precio_promo:(s.promo!=null && Number(s.promo)!==Number(s.regular)) ? Number(s.promo) : 0,
    precio:Number(s.promo??s.regular??0)
  });
  state.quoteResult=null;
  render();
}
function removeQuoteItem(i){state.quoteItems.splice(i,1);state.quoteResult=null;render()}
function effectiveQuotePrice(x){
  const promo=Number(x.precio_promo||0);
  const lista=Number(x.precio_lista||x.precio||0);
  return promo>0 ? promo : lista;
}
function refreshQuoteTotal(){
  state.quoteResult=null;
  const el=document.querySelector('#quoteTotal');
  if(el)el.textContent=money(quoteTotal());
}
function updateQuoteListPrice(i,v){
  state.quoteItems[i].precio_lista=Number(v||0);
  state.quoteItems[i].precio=effectiveQuotePrice(state.quoteItems[i]);
  refreshQuoteTotal();
}
function updateQuotePromoPrice(i,v){
  state.quoteItems[i].precio_promo=Number(v||0);
  state.quoteItems[i].precio=effectiveQuotePrice(state.quoteItems[i]);
  refreshQuoteTotal();
}
function updateInclude(i,v){state.quoteItems[i].incluye=v;state.quoteResult=null}
function setPromoDate(v){state.promoDate=v;state.quoteResult=null}
function quoteTotal(){return state.quoteItems.reduce((a,x)=>a+effectiveQuotePrice(x),0)}
function formatPromoDate(v){if(!v)return '';const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}


function quotePdfUrl(r){
  if(!r)return '';
  return r.pdf_url || r.webViewLink || r.web_view_link || r.url || r.file_url || '';
}
function quoteWhatsAppUrl(){
  const r=state.quoteResult||{};
  const pdf=quotePdfUrl(r);
  const tel=String(state.patient?.telefono||state.patient?.telephone2||'').replace(/\D/g,'');
  const numero=tel.startsWith('52')?tel:`52${tel}`;
  const nombre=state.patient?.nombre||[state.patient?.first_name,state.patient?.last_name].filter(Boolean).join(' ')||'';
  const folio=r.numero_cotizacion||'';
  const texto=[
    `Hola${nombre?` ${nombre}`:''}, te compartimos la cotización solicitada del consultorio del Dr. Héctor Carrillo.`,
    folio?`Folio: ${folio}.`:'',
    pdf?`Puedes consultarla aquí: ${pdf}`:'',
    'Si tienes alguna duda, con gusto te apoyamos.'
  ].filter(Boolean).join('\n');
  return `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;
}
async function shareQuote(){
  const r=state.quoteResult||{};
  const pdf=quotePdfUrl(r);
  if(!pdf)return toast('No recibí la liga del PDF');
  const nombre=state.patient?.nombre||'Paciente';
  if(navigator.share){
    try{
      await navigator.share({
        title:`Cotización Dr. Héctor Carrillo - ${nombre}`,
        text:'Te compartimos tu cotización del consultorio del Dr. Héctor Carrillo.',
        url:pdf
      });
      return;
    }catch(e){
      if(e?.name==='AbortError')return;
    }
  }
  try{
    await navigator.clipboard.writeText(pdf);
    toast('Liga del PDF copiada');
  }catch(e){
    window.open(pdf,'_blank');
  }
}

function quoteResultCard(){
  if(!state.quoteResult)return '';
  const r=state.quoteResult;
  const pdf=quotePdfUrl(r);
  return `<div class="mt-5 border border-emerald-200 bg-emerald-50 rounded-2xl p-4">
    <div class="font-semibold text-emerald-800">Cotización generada ✓</div>
    <div class="text-sm text-emerald-700 mt-1">${r.numero_cotizacion||''}</div>
    ${pdf?`<div class="grid sm:grid-cols-3 gap-2 mt-4">
      <a href="${pdf}" target="_blank" rel="noopener" class="btn rounded-xl py-3 text-center text-sm font-semibold">Ver PDF</a>
      <a href="${quoteWhatsAppUrl()}" target="_blank" rel="noopener" class="border border-emerald-300 text-emerald-800 rounded-xl py-3 text-center text-sm font-semibold">Enviar por WhatsApp</a>
      <button onclick="shareQuote()" class="border rounded-xl py-3 text-sm font-semibold">Compartir</button>
    </div>`:`<div class="mt-3 text-sm text-amber-700">El PDF se generó, pero el webhook no devolvió una liga para abrirlo.</div>`}
  </div>`;
}

async function generateQuote(){
  if(!state.patient||!state.quoteItems.length)return;
  if(!C.quoteWebhook)return toast('Falta configurar quoteWebhook');
  setLoading(true,'Generando cotización…');
  const payload={
    numero_cotizacion:'HC-'+Date.now(),
    fecha:new Date().toLocaleDateString('es-MX'),
    vigencia_dias:30,
    vigencia_fecha:formatPromoDate(state.promoDate),
    paciente:{
      id:state.patient.id,
      nombre:state.patient.nombre||[state.patient.first_name,state.patient.last_name].filter(Boolean).join(' '),
      telefono:state.patient.telefono,
      correo:state.patient.email
    },
    items:state.quoteItems.map(x=>({
      concepto:x.concepto,
      descripcion:x.descripcion,
      incluye:x.incluye||'',
      precio_lista:Number(x.precio_lista||x.precio||0),
      precio_promo:Number(x.precio_promo||0),
      precio:effectiveQuotePrice(x),
      nimbo_item_id:x.nimbo_item_id||null
    })),
    total:quoteTotal()
  };
  try{
    const resp=await fetch(C.quoteWebhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await resp.json().catch(()=>({}));
    state.loading=false;
    if(!resp.ok||data.ok===false){render();toast('El workflow respondió con error');return}
    state.quoteResult=data;render();toast('Cotización generada');
  }catch(e){state.loading=false;render();toast('No pude conectar con cotizaciones')}
}


async function loadProducts(){
  setLoading(true,'Cargando catálogo de Nimbo…');
  try{
    const r=await core({action:'listar_productos'});
    state.loading=false;
    state.products=Array.isArray(r.productos)?r.productos:[];
    state.productsLoaded=true;
    render();
    if(!state.products.length)toast('No encontré conceptos activos');
  }catch(e){
    state.loading=false;
    state.products=[];
    state.productsLoaded=true;
    render();
    toast('No pude cargar el catálogo de Nimbo');
  }
}

function setAdminProductSearch(v){
  state.productSearch=String(v||'');
  render();
  const el=document.querySelector('#adminProductSearch');
  if(el){
    el.focus();
    try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}
  }
}

function filteredProducts(){
  const q=state.productSearch.trim().toLowerCase();
  if(!q)return state.products;
  return state.products.filter(p=>String(p.nombre||'').toLowerCase().includes(q));
}

function addNimboItemToQuote(id){
  const p=state.products.find(x=>String(x.id)===String(id));
  if(!p)return toast('No encontré el concepto');

  state.quoteItems.push({
    concepto:p.nombre||'Concepto Nimbo',
    descripcion:'Concepto tomado del catálogo de Nimbo',
    incluye:'',
    precio_lista:Number(p.precio||0),
    precio_promo:0,
    precio:Number(p.precio||0),
    nimbo_item_id:p.id
  });

  state.quoteResult=null;
  state.view='cotizaciones';
  render();
  toast('Concepto agregado a la cotización');
}

function logout(){
  state.authorized=false;
  state.pin='';
  state.patient=null;
  state.quoteItems=[];
  state.quoteResult=null;
  state.products=[];
  state.productsLoaded=false;
  state.productSearch='';
  state.view='resumen';
  render();
}
function go(v){state.view=v;render()}
function render(){document.querySelector('#root').innerHTML=state.authorized?shell():login()}


let deferredInstallPrompt=null;
let installBannerDismissed=false;
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;}
function renderInstallBanner(){
  const mount=document.getElementById('installMount');
  if(!mount||isStandalone()||installBannerDismissed){if(mount)mount.innerHTML='';return;}
  const canNative=!!deferredInstallPrompt;
  const ios=isIOS();
  if(!canNative&&!ios){mount.innerHTML='';return;}
  mount.innerHTML=`<div class="install-banner">
    <img src="assets/logo-admin.png" alt="">
    <div class="min-w-0 flex-1">
      <div class="font-semibold text-sm">Instalar Admin</div>
      <div class="text-xs text-slate-500 mt-1">${ios?'Toca Compartir y luego “Agregar a pantalla de inicio”.':'Instálala en tu celular para abrirla como una app.'}</div>
      <div class="install-actions">
        ${canNative?'<button class="install-btn install-primary" onclick="installApp()">Instalar</button>':''}
        <button class="install-btn install-dismiss" onclick="dismissInstall()">Después</button>
      </div>
    </div>
  </div>`;
}
async function installApp(){
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  try{await deferredInstallPrompt.userChoice;}catch(e){}
  deferredInstallPrompt=null;
  renderInstallBanner();
}
function dismissInstall(){installBannerDismissed=true;renderInstallBanner();}
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredInstallPrompt=e;renderInstallBanner();});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;installBannerDismissed=true;renderInstallBanner();});
setTimeout(renderInstallBanner,900);

render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw-admin.js?v=30');
</script>
