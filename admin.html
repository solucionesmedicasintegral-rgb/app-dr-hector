<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#062f54"><link rel="manifest" href="manifest-admin.json"><link rel="icon" href="assets/logo-admin.png"><title>Admin · Dr. Héctor</title><script src="https://cdn.tailwindcss.com"></script><style>:root{--navy:#062f54;--navy2:#0a497b;--gold:#d7a72c;--ice:#eef5fa}body{background:#edf2f5;font-family:Inter,system-ui}.brand{background:linear-gradient(145deg,var(--navy),var(--navy2))}.card{background:white;border:1px solid #dce6ec}.btn{background:var(--navy);color:white}.gold{color:var(--gold)}</style></head><body><div class="min-h-screen"><header class="brand text-white px-5 py-5"><div class="max-w-6xl mx-auto flex items-center gap-3"><img src="assets/logo-admin.png" class="w-14 h-14 rounded-2xl"><div><div class="text-xs opacity-70">Control Center</div><h1 class="font-semibold text-xl">Dr. Héctor Carrillo</h1></div></div></header><main class="max-w-6xl mx-auto p-5"><div class="grid lg:grid-cols-3 gap-4"><section class="card rounded-3xl p-5 lg:col-span-1"><h2 class="font-semibold text-lg">Buscar paciente</h2><div class="flex gap-2 mt-3"><input id="phone" class="border rounded-xl p-3 w-full" placeholder="WhatsApp 10 dígitos"><button onclick="findP()" class="btn rounded-xl px-4">Buscar</button></div><div id="patient" class="mt-4 text-sm text-stone-500">Sin paciente seleccionado.</div></section><section class="card rounded-3xl p-5 lg:col-span-2"><div class="flex items-center justify-between"><div><h2 class="font-semibold text-lg">Cotización</h2><p class="text-sm text-stone-500">Usa el tarifario oficial y genera PDF con la plantilla de Drive.</p></div><button onclick="addItem()" class="text-sm gold font-semibold">+ Concepto</button></div><div id="items" class="space-y-2 mt-4"></div><div class="flex justify-between border-t mt-4 pt-4"><b>Total</b><b id="total">$0</b></div><button onclick="quote()" class="btn rounded-2xl w-full py-4 mt-4 font-semibold">Generar cotización</button><div id="msg" class="text-sm mt-3"></div></section></div><section class="card rounded-3xl p-5 mt-4"><h2 class="font-semibold text-lg">Servicios</h2><div id="svc" class="grid md:grid-cols-2 xl:grid-cols-3 gap-3 mt-4"></div></section></main></div><script src="config.js"></script><script src="services.js"></script><script>
const C=HECTOR_CONFIG,S=HECTOR_SERVICES;let p=null,items=[];const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n||0);async function api(b){const r=await fetch(C.webhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error();return r.json()}async function findP(){let t=phone.value.replace(/\D/g,'').slice(-10);try{const r=await api({action:'buscar_paciente',telefono:t});p=r.paciente||null;patient.innerHTML=p?`<b>${p.nombre}</b><div>${p.telefono||t}</div><div>${p.email||''}</div><div class="text-xs mt-1">Nimbo ID ${p.id}</div>`:'No encontrado en Nimbo'}catch(e){patient.textContent='Error al buscar'}}function addItem(code){const s=code?S.find(x=>x.code===code):S[0];items.push({concepto:s.name,descripcion:s.description,incluye:'',precio:s.promo??s.regular});draw()}function removeI(i){items.splice(i,1);draw()}function draw(){itemsEl=items;document.querySelector('#items').innerHTML=items.map((x,i)=>`<div class="grid grid-cols-[1fr_auto] gap-2 border rounded-xl p-3"><div><input class="w-full font-medium" value="${x.concepto.replace(/"/g,'&quot;')}" onchange="items[${i}].concepto=this.value"><div class="text-xs text-stone-500">${x.descripcion}</div><input type="number" class="border rounded-lg p-2 mt-2 w-32" value="${x.precio}" onchange="items[${i}].precio=Number(this.value);draw()"></div><button onclick="removeI(${i})">✕</button></div>`).join('');const sum=items.reduce((a,x)=>a+Number(x.precio||0),0);total.textContent=money(sum)}async function quote(){if(!p)return msg.textContent='Selecciona un paciente primero.';if(!items.length)return msg.textContent='Agrega al menos un concepto.';const payload={numero_cotizacion:'HC-'+Date.now(),fecha:new Date().toLocaleDateString('es-MX'),vigencia_dias:30,paciente:{nombre:p.nombre,telefono:p.telefono,correo:p.email},items,total:items.reduce((a,x)=>a+Number(x.precio||0),0)};try{const r=await fetch(C.quoteWebhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});msg.textContent=r.ok?'Cotización enviada al workflow de n8n.':'El workflow respondió con error.'}catch(e){msg.textContent='No se pudo conectar con cotizaciones.'}}svc.innerHTML=S.map(s=>`<button onclick="addItem('${s.code}')" class="border rounded-xl p-3 text-left"><div class="font-medium">${s.name}</div><div class="gold text-sm">${money(s.promo??s.regular)}</div></button>`).join('');draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw-admin.js');
</script></body></html>
