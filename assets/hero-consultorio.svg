<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520">
<defs>
  <linearGradient id="wall" x1="0" x2="1"><stop stop-color="#c9955b"/><stop offset="1" stop-color="#b8783d"/></linearGradient>
  <linearGradient id="chair" x1="0" x2="1"><stop stop-color="#f2e7d8"/><stop offset="1" stop-color="#cdb08d"/></linearGradient>
  <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#d8b78f"/><stop offset="1" stop-color="#c79d70"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity=".22"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="1000" height="520" fill="#d2aa7c"/>
<rect width="1000" height="345" fill="url(#wall)"/>
<g opacity=".18" stroke="#6f4525" stroke-width="3">
  <path d="M80 0v345M210 0v345M340 0v345M470 0v345M600 0v345M730 0v345M860 0v345M990 0v345"/>
</g>
<rect y="345" width="1000" height="175" fill="url(#floor)"/>

<!-- glowing wall logo -->
<g transform="translate(710 42)">
  <circle cx="110" cy="90" r="88" fill="#fff2c8" opacity=".13" filter="url(#glow)"/>
  <path d="M105 38c-36 8-63 38-65 73 40-1 72-28 79-65-9 41-37 74-78 88 22 15 48 17 69 8 40-17 58-62 42-101-8-19-26-34-47-38z" fill="#fff0bd"/>
  <path d="M113 24c-14 26-34 46-61 61" fill="none" stroke="#fff8dd" stroke-width="9" stroke-linecap="round"/>
</g>

<!-- back counter -->
<g filter="url(#shadow)">
  <rect x="675" y="278" width="280" height="104" rx="14" fill="#c59056"/>
  <rect x="695" y="300" width="235" height="16" rx="8" fill="#e6c39a" opacity=".75"/>
</g>

<!-- plant left -->
<g transform="translate(130 115)">
