    <ellipse cx="106" cy="220" rx="24" ry="72" transform="rotate(-18 106 220)"/>
    <ellipse cx="160" cy="225" rx="24" ry="70" transform="rotate(20 160 225)"/>
  </g>
  <g fill="#607947">
    <ellipse cx="132" cy="95" rx="13" ry="68" transform="rotate(10 132 95)"/>
    <ellipse cx="78" cy="158" rx="12" ry="58" transform="rotate(-32 78 158)"/>
    <ellipse cx="184" cy="164" rx="12" ry="58" transform="rotate(30 184 164)"/>
  </g>
  <rect x="91" y="315" width="85" height="60" rx="9" fill="#a86d3f"/>
