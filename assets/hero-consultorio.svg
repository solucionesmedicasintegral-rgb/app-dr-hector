<!-- large foreground chair -->
<g transform="translate(380 205)" filter="url(#shadow)">
  <ellipse cx="230" cy="265" rx="190" ry="28" fill="#6f492d" opacity=".18"/>
  <path d="M70 242c-28-32-36-92-13-131 24-42 70-67 130-67 72 0 126 29 151 82 17 36 17 79 2 116z" fill="url(#chair)"/>
  <path d="M106 241c-6-60 2-112 35-137 30-23 83-26 119-5 38 22 55 75 47 142z" fill="#eadcc9"/>
  <path d="M61 239c-29-23-41-70-29-105 9-27 31-47 65-56l18 45c-22 8-32 21-34 41-2 22 4 43 18 62z" fill="#d9c2a5"/>
  <path d="M345 239c29-23 41-70 29-105-9-27-31-47-65-56l-18 45c22 8 32 21 34 41 2 22-4 43-18 62z" fill="#d9c2a5"/>
  <rect x="103" y="225" width="202" height="34" rx="16" fill="#c7aa86"/>
</g>

<!-- small side plant -->
<g transform="translate(865 258)">
  <rect x="31" y="66" width="11" height="72" rx="5" fill="#6d4932"/>
  <g fill="#415b31">
    <ellipse cx="37" cy="38" rx="17" ry="43" transform="rotate(15 37 38)"/>
    <ellipse cx="14" cy="58" rx="13" ry="37" transform="rotate(-28 14 58)"/>
