<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263514"><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/logo-paciente.png"><title>Mi Salud · Dr. Héctor</title><script src="https://cdn.tailwindcss.com"></script><style>:root{--olive:#263514;--olive2:#35471d;--gold:#d7a72c;--cream:#f7f4ec}body{background:var(--cream);font-family:Inter,system-ui,sans-serif}.brand{background:linear-gradient(145deg,var(--olive),var(--olive2))}.gold{color:var(--gold)}.btn{background:var(--olive);color:white}.btn:hover{background:#1d2a0e}.card{background:white;border:1px solid #e8e3d8;box-shadow:0 8px 24px #26351412}.slot.active{border-color:var(--gold);background:#fff8df}.navbtn.active{color:var(--gold)}input,select{background:white}</style></head><body><div id="app"></div><script src="config.js"></script><script src="services.js"></script><script>
const C=HECTOR_CONFIG,S=HECTOR_SERVICES;let state={patient:null,phone:'',view:'login',service:null,slots:[],slot:null,loading:false};
const money=n=>n==null?'—':new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n);
async function api(body){const r=await fetch(C.webhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('Error '+r.status);return r.json()}
function toast(t){const e=document.createElement('div');e.className='fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-black text-white px-4 py-3 rounded-xl text-sm';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function shell(content){return `<div class="min-h-screen pb-24"><header class="brand text-white px-5 pt-7 pb-8 rounded-b-[32px]"><div class="max-w-xl mx-auto flex items-center gap-3"><img src="assets/logo-paciente.png" class="w-14 h-14 rounded-2xl"><div><div class="text-xs opacity-70">Tu espacio de salud</div><h1 class="font-semibold text-xl">Dr. Héctor Carrillo</h1></div></div></header><main class="max-w-xl mx-auto p-4 -mt-3">${content}</main>${state.patient?nav():''}</div>`}
function nav(){return `<nav class="fixed bottom-0 inset-x-0 bg-white border-t border-stone-200"><div class="max-w-xl mx-auto grid grid-cols-3 py-2"><button class="navbtn ${state.view==='home'?'active':''}" onclick="go('home')">⌂<span class="block text-xs">Inicio</span></button><button class="navbtn ${state.view==='book'?'active':''}" onclick="go('book')">＋<span class="block text-xs">Agendar</span></button><button class="navbtn ${state.view==='services'?'active':''}" onclick="go('services')">♡<span class="block text-xs">Servicios</span></button></div></nav>`}
function render(){let h='';if(state.view==='login')h=login();else if(state.view==='register')h=register();else if(state.view==='home')h=home();else if(state.view==='services')h=services();else if(state.view==='book')h=book();document.querySelector('#app').innerHTML=shell(h)}
function login(){return `<section class="card rounded-3xl p-6"><h2 class="text-2xl font-semibold text-stone-800">Bienvenida</h2><p class="text-stone-500 mt-2">Ingresa tu número de WhatsApp para localizar tu expediente en Nimbo.</p><label class="block mt-5 text-sm font-medium">WhatsApp</label><input id="phone" inputmode="numeric" maxlength="10" class="w-full border rounded-2xl px-4 py-4 mt-2 text-lg" placeholder="33 1234 5678"><button onclick="findPatient()" class="btn w-full rounded-2xl py-4 mt-4 font-semibold">Continuar</button></section>`}
async function findPatient(){const p=document.querySelector('#phone').value.replace(/\D/g,'').slice(-10);if(p.length!==10)return toast('Ingresa 10 dígitos');state.phone=p;try{const r=await api({action:'buscar_paciente',telefono:p});if(r.encontrado){state.patient=r.paciente;state.view='home';render()}else{state.view='register';render()}}catch(e){toast('No pude conectar con Nimbo')}}
function register(){return `<section class="card rounded-3xl p-5"><button onclick="go('login')" class="text-sm gold">← Regresar</button><h2 class="text-xl font-semibold mt-3">Crear expediente</h2><p class="text-sm text-stone-500 mt-1">Solo pedimos los datos obligatorios de Nimbo.</p><div class="grid gap-3 mt-4"><input id="fn" class="border rounded-xl p-3" placeholder="Nombre(s)"><input id="ln" class="border rounded-xl p-3" placeholder="Apellidos"><input id="dob" type="date" class="border rounded-xl p-3"><select id="gender" class="border rounded-xl p-3"><option value="">Sexo</option><option value="f">Femenino</option><option value="m">Masculino</option></select><input id="email" type="email" class="border rounded-xl p-3" placeholder="Correo electrónico"><input value="${state.phone}" disabled class="border rounded-xl p-3 bg-stone-100"></div><button onclick="createPatient()" class="btn w-full rounded-2xl py-4 mt-4 font-semibold">Crear expediente</button><p class="text-xs text-stone-400 mt-3">Los recordatorios automáticos y el correo de bienvenida de Nimbo permanecen desactivados.</p></section>`}
async function createPatient(){const b={action:'crear_paciente',telefono:state.phone,first_name:fn.value.trim(),last_name:ln.value.trim(),born_at:dob.value,gender:gender.value,email:email.value.trim()};if(!b.first_name||!b.last_name||!b.born_at||!b.gender||!b.email)return toast('Completa todos los campos');try{const r=await api(b);state.patient=r.paciente;state.view='home';toast('Expediente creado');render()}catch(e){toast('No se pudo crear el expediente')}}
function home(){return `<div class="grid gap-4"><section class="card rounded-3xl p-5"><p class="text-sm text-stone-500">Hola</p><h2 class="text-2xl font-semibold">${state.patient.nombre||state.patient.first_name}</h2><p class="text-sm text-stone-500 mt-1">Tu expediente está conectado con Nimbo.</p></section><button onclick="go('book')" class="brand text-white text-left rounded-3xl p-6"><div class="gold text-sm">Agenda en tiempo real</div><div class="text-2xl font-semibold mt-1">Agendar una cita</div><div class="opacity-70 text-sm mt-2">Consulta disponibilidad real del Dr. Héctor.</div></button><button onclick="go('services')" class="card rounded-3xl p-5 text-left"><div class="font-semibold text-lg">Ver servicios y precios</div><div class="text-sm text-stone-500">Tarifario vigente de agosto 2026</div></button></div>`}
function services(){return `<div class="space-y-3">${S.map(s=>`<article class="card rounded-2xl p-4"><div class="flex justify-between gap-3"><div><h3 class="font-semibold">${s.name}</h3><p class="text-xs text-stone-500 mt-1">${s.description}</p></div><div class="text-right shrink-0"><div class="font-semibold">${money(s.promo??s.regular)}</div>${s.promo?`<div class="text-xs line-through text-stone-400">${money(s.regular)}</div>`:''}</div></div>${s.bookable?`<button onclick="pickService('${s.code}')" class="mt-3 text-sm gold font-semibold">Agendar →</button>`:`<div class="mt-3 text-xs text-stone-400">Solicitar con asesor</div>`}</article>`).join('')}</div>`}
function pickService(code){state.service=S.find(x=>x.code===code);state.view='book';state.slots=[];state.slot=null;render();loadSlots()}
function book(){if(!state.service)return `<section class="card rounded-3xl p-5"><h2 class="text-xl font-semibold">Elige un servicio</h2><div class="mt-4 space-y-2">${S.filter(x=>x.bookable).map(s=>`<button onclick="pickService('${s.code}')" class="w-full border rounded-2xl p-4 text-left"><div class="font-medium">${s.name}</div><div class="text-sm gold">${money(s.promo??s.regular)}</div></button>`).join('')}</div></section>`;return `<section class="card rounded-3xl p-5"><button onclick="state.service=null;render()" class="text-sm gold">← Cambiar servicio</button><h2 class="text-xl font-semibold mt-2">${state.service.name}</h2><div class="flex gap-3 text-sm mt-2"><span>${money(state.service.promo??state.service.regular)}</span><span class="text-stone-400">${state.service.duration} min</span><span class="text-stone-400 capitalize">${state.service.mode}</span></div><h3 class="font-semibold mt-5">Horarios disponibles</h3><div id="slots" class="grid grid-cols-2 gap-2 mt-3">${state.slots.length?state.slots.map((x,i)=>`<button class="slot border rounded-xl p-3 text-sm ${state.slot===i?'active':''}" onclick="state.slot=${i};render()"><div>${new Date(x.inicio_iso).toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'})}</div><b>${x.hora}</b></button>`).join(''):'<div class="col-span-2 text-sm text-stone-500">Cargando disponibilidad…</div>'}</div>${state.slot!==null?`<button onclick="confirmBooking()" class="btn w-full rounded-2xl py-4 mt-5 font-semibold">Confirmar cita</button>`:''}</section>`}
async function loadSlots(){try{const r=await api({action:'consultar_disponibilidad',modalidad:state.service.mode,duracion:state.service.duration});state.slots=r.horarios||[];render()}catch(e){toast('No pude consultar disponibilidad')}}
async function confirmBooking(){const x=state.slots[state.slot];if(!x)return;try{const r=await api({action:'crear_cita',paciente_id:state.patient.id,fecha:x.fecha,hora:x.hora,duracion:state.service.duration,motivo_consulta:state.service.cause,encounter_type_id:state.service.encounterTypeId,modalidad:state.service.mode});toast('Cita creada en Nimbo');state.view='home';state.service=null;state.slot=null;render()}catch(e){toast('No se pudo crear la cita')}}
function go(v){state.view=v;render()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
